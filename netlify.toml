[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, OPTIONS"
    Access-Control-Allow-Headers = "*"

[[redirects]]
  from = "/api/landregistry"
  to = "https://landregistry.data.gov.uk/data/ppi/transaction-record.json"
  status = 200
  force = true

[[redirects]]
  from = "/api/postcodes/*"
  to = "https://api.postcodes.io/postcodes/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/postcodes"
  to = "https://api.postcodes.io/postcodes"
  status = 200
  force = true
